<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazine Design — Badal Rana</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07070a;--bg2:#0d0d12;--bg3:#131318;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#eeeae3;--muted:#5a5a6a;--muted2:#888899;
  --accent:#F97316;--fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.6;}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1.4rem 5rem;background:rgba(7,7,10,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.back-link{display:inline-flex;align-items:center;gap:.6rem;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);text-decoration:none;transition:color .2s;}
.back-link:hover{color:var(--accent);}
.back-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.n-logo{font-family:var(--fd);font-size:1.05rem;font-weight:800;color:var(--text);text-decoration:none;letter-spacing:-.01em;}
.n-logo span{color:var(--accent);}
.g-header{padding:5rem 5rem 3rem;border-bottom:1px solid var(--border);background:var(--bg2);position:relative;overflow:hidden;}
.g-glow{position:absolute;top:-200px;right:-150px;width:600px;height:600px;background:radial-gradient(circle,rgba(249,115,22,.06) 0%,transparent 65%);pointer-events:none;}
.g-cat-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.22);padding:.32rem .8rem;border-radius:2rem;margin-bottom:1.2rem;}
.g-cat-dot{width:4px;height:4px;background:var(--accent);border-radius:50%;}
.g-title{font-family:var(--fd);font-size:clamp(2.2rem,5.5vw,4.2rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-bottom:1.2rem;}
.g-desc{font-size:1rem;font-weight:300;color:rgba(238,234,227,.65);line-height:1.85;max-width:620px;}
.g-drive{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--fd);font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--text);background:transparent;border:1px solid var(--border2);padding:.75rem 1.6rem;border-radius:3rem;text-decoration:none;margin-top:2rem;transition:all .25s;}
.g-drive:hover{border-color:var(--accent);color:var(--accent);}
.g-wrap{padding:4rem 5rem 6rem;max-width:1400px;}
/* IMAGE grid — 1:1 */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;}
.g-item{position:relative;aspect-ratio:1/1;border-radius:14px;border:1px solid var(--border);background:var(--bg2);overflow:hidden;cursor:pointer;}
.g-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.g-item:hover img{transform:scale(1.05);}
/* VIDEO grid — 16:9 */
.gallery-grid-video{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1.2rem;}
.g-item-video{position:relative;aspect-ratio:16/9;border-radius:14px;border:1px solid var(--border);background:var(--bg2);overflow:hidden;}
.g-item-video iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.g-section-title{font-family:var(--fd);font-size:1.1rem;font-weight:700;letter-spacing:.04em;color:var(--text);margin:2.5rem 0 1rem;padding-bottom:.6rem;border-bottom:1px solid var(--border);}
footer{padding:3rem 5rem;border-top:1px solid var(--border);text-align:center;font-size:.78rem;color:var(--muted);}
footer a{color:var(--accent);text-decoration:none;}
@media(max-width:768px){
  .topbar,.g-header,.g-wrap,footer{padding-left:1.5rem;padding-right:1.5rem;}
  .g-header{padding-top:3rem;}
  .gallery-grid-video{grid-template-columns:1fr;}
}

/* LIGHTBOX */
.lb-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);align-items:center;justify-content:center;flex-direction:column;gap:1rem;}
.lb-overlay.active{display:flex;}
.lb-inner{position:relative;max-width:90vw;max-height:85vh;display:flex;align-items:center;justify-content:center;}
.lb-inner iframe{width:85vw;height:85vh;border:none;border-radius:12px;}
.lb-inner img{max-width:88vw;max-height:82vh;object-fit:contain;border-radius:12px;}
.lb-close{position:fixed;top:1.5rem;right:2rem;font-size:2rem;color:#fff;cursor:pointer;background:none;border:none;line-height:1;opacity:.7;transition:opacity .2s;z-index:1010;}
.lb-close:hover{opacity:1;}
.lb-nav{display:flex;gap:1rem;}
.lb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:.5rem 1.4rem;border-radius:2rem;cursor:pointer;font-size:.85rem;transition:background .2s;}
.lb-btn:hover{background:rgba(249,115,22,.25);border-color:var(--accent);}
/* PDF card overlay */
.pdf-badge{position:absolute;bottom:.7rem;left:.7rem;background:rgba(249,115,22,.85);color:#fff;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.2rem .55rem;border-radius:.3rem;}
.g-item .zoom-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;background:rgba(0,0,0,.45);transition:opacity .25s;}
.g-item:hover .zoom-hint{opacity:1;}
.zoom-hint svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.5;}
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html#projects" class="back-link">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Portfolio
  </a>
  <a href="index.html" class="n-logo">Badal<span>Rana</span></a>
</div>
<header class="g-header">
  <div class="g-glow"></div>
  <div class="g-cat-badge"><span class="g-cat-dot"></span>Editorial</div>
  <h1 class="g-title">Magazine Design</h1>
  <p class="g-desc">Full editorial layouts — spreads, typography, and visual hierarchies that elevate print.</p>
  <a href="https://drive.google.com/drive/folders/1EYkjxn2d4A_HaL_tPmRFE3uYFsh1XAFA" target="_blank" class="g-drive">
    <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/></svg>
    View on Google Drive
  </a>
</header>
<div class="g-wrap">
  <div class="gallery-grid">
    <div class="g-item" data-lb="img" data-src="https://drive.google.com/thumbnail?id=169gU41n3l0LP4EEUq40uNbYVXP0sr77w&sz=w1200" data-label="">
      <img src="https://drive.google.com/thumbnail?id=169gU41n3l0LP4EEUq40uNbYVXP0sr77w&sz=w1200" alt="" loading="lazy">
      <div class="zoom-hint"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div>
    </div>
    <div class="g-item" data-lb="img" data-src="https://drive.google.com/thumbnail?id=1_JWz_rm6LnCrmbrIBtmYnoPbRdNQ9X1r&sz=w1200" data-label="">
      <img src="https://drive.google.com/thumbnail?id=1_JWz_rm6LnCrmbrIBtmYnoPbRdNQ9X1r&sz=w1200" alt="" loading="lazy">
      <div class="zoom-hint"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div>
    </div>
    <div class="g-item" data-lb="img" data-src="https://drive.google.com/thumbnail?id=1w2nBvtr0YDoKObGRjo1T5px1P7vJN4Ei&sz=w1200" data-label="">
      <img src="https://drive.google.com/thumbnail?id=1w2nBvtr0YDoKObGRjo1T5px1P7vJN4Ei&sz=w1200" alt="" loading="lazy">
      <div class="zoom-hint"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></div>
    </div>
  </div>
</div>

<div class="lb-overlay" id="lb">
  <button class="lb-close" id="lb-close">&times;</button>
  <div class="lb-inner" id="lb-content"></div>
  <div class="lb-nav">
    <button class="lb-btn" onclick="prev()">&#8592; Prev</button>
    <span id="lb-counter" style="color:rgba(255,255,255,.5);font-size:.8rem;align-self:center;"></span>
    <button class="lb-btn" onclick="next()">Next &#8594;</button>
  </div>
</div>

<footer>
  &copy; 2026 Badal Rana — <a href="index.html">Back to Portfolio Home</a>
</footer>

<script>
const lb = document.getElementById('lb');
const lbContent = document.getElementById('lb-content');
let items = [];
let cur = 0;

document.querySelectorAll('[data-lb]').forEach((el,i)=>{
  el.dataset.lbIdx = i;
  items.push({type: el.dataset.lb, src: el.dataset.src, label: el.dataset.label||''});
  el.addEventListener('click', ()=>open(i));
});

function open(i){
  cur = i;
  render();
  lb.classList.add('active');
  document.body.style.overflow='hidden';
}
function close(){
  lb.classList.remove('active');
  lbContent.innerHTML='';
  document.body.style.overflow='';
}
function render(){
  const d = items[cur];
  if(d.type==='pdf'){
    lbContent.innerHTML = `<iframe src="${d.src}" allowfullscreen></iframe>`;
  } else {
    lbContent.innerHTML = `<img src="${d.src}" alt="${d.label}">`;
  }
  document.getElementById('lb-counter').textContent = (cur+1)+' / '+items.length;
}
function prev(){ cur=(cur-1+items.length)%items.length; render(); }
function next(){ cur=(cur+1)%items.length; render(); }

document.getElementById('lb-close').addEventListener('click', close);
lb.addEventListener('click', e=>{ if(e.target===lb) close(); });
document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('active')) return;
  if(e.key==='Escape') close();
  if(e.key==='ArrowRight') next();
  if(e.key==='ArrowLeft') prev();
});
</script>

</body>
</html>
