<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Production — Badal Rana</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --blue:#2A3FE4; --blue2:#1E2FBE; --ink:#0A0A10;
  --cream:#F4F0E4; --cream2:#EAE4D4; --text:#F4F0E4; --dark:#14141c;
  --lime:#D9FF4B; --red:#FF5A4E;
  --fh:'Caveat',cursive; --fk:'Kalam',cursive; --fb:'Inter',sans-serif;
  --cur-color: var(--lime);
}
html{scroll-behavior:smooth;}
body{background:var(--blue);color:var(--text);font-family:var(--fb);line-height:1.6;overflow-x:hidden;}
a{color:inherit;}
img,video,iframe{max-width:100%;display:block;}
::selection{background:var(--lime);color:#111;}

/* CUSTOM CURSOR */
#cur{
  width:8px;height:8px;background:var(--cur-color);border-radius:50%;
  position:fixed;top:0;left:0;pointer-events:none;z-index:9500;
  transform:translate(-50%,-50%);transition:transform .15s ease,opacity .25s ease,background-color .2s ease;
}
#cur-r{
  width:36px;height:36px;border:1.5px solid var(--cur-color);border-radius:50%;
  position:fixed;top:0;left:0;pointer-events:none;z-index:9499;
  transform:translate(-50%,-50%);transition:opacity .25s ease,transform .2s ease,border-color .2s ease;
}
body.hide-cursor #cur, body.hide-cursor #cur-r{opacity:0;transform:translate(-50%,-50%) scale(0.4);}
@media(hover:none){#cur,#cur-r{display:none;}}

/* UNIFIED SMOOTH PARALLAX TRANSFORM CARRIER */
.follow-mouse{
  will-change:transform;
  transform: translate3d(calc(var(--px, 0px) * var(--pm, 1)), calc(var(--py, 0px) * var(--pm, 1)), 0) rotate(var(--base-rot, 0deg));
}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1rem 3rem;background:rgba(10,10,16,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(244,240,228,.14);}
.back-link{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--fk);font-size:.85rem;font-weight:700;color:rgba(244,240,228,.8);text-decoration:none;transition:color .2s;}
.back-link:hover{color:var(--lime);}
.back-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.n-logo{font-family:var(--fh);font-size:1.4rem;font-weight:700;color:var(--cream);text-decoration:none;}
.n-logo span{color:var(--lime);}

/* HEADER */
.g-header{padding:5rem 3rem 3.5rem;background:var(--blue);border-bottom:1px solid rgba(244,240,228,.15);position:relative;overflow:hidden;}
.blueprint{background-image:linear-gradient(rgba(244,240,228,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(244,240,228,.06) 1px,transparent 1px);background-size:38px 38px;}
.g-cat-badge{
  display:inline-block;background:var(--cream);color:#111;font-family:var(--fk);
  font-size:.78rem;font-weight:700;padding:.35rem .9rem;border:2px solid #111;
  border-radius:4px;box-shadow:4px 4px 0 rgba(0,0,0,.25);margin-bottom:1.4rem;
  --base-rot: -2deg;
}
.g-title{font-family:var(--fh);font-size:clamp(2.8rem,7vw,5.5rem);font-weight:700;line-height:.95;color:var(--cream);letter-spacing:-.02em;margin-bottom:1.2rem;}
.g-desc{font-size:.98rem;color:rgba(244,240,228,.82);line-height:1.75;max-width:680px;}
.g-drive{
  display:inline-flex;align-items:center;gap:.6rem;font-family:var(--fh);
  font-size:1.2rem;font-weight:700;color:var(--ink);background:var(--lime);
  border:2px solid #111;padding:.6rem 1.5rem;border-radius:3rem;text-decoration:none;
  margin-top:2rem;box-shadow:5px 5px 0 rgba(0,0,0,.3);
  --base-rot: -1deg;
  transition:box-shadow .2s ease;
}
.g-drive:hover{box-shadow:8px 8px 0 rgba(0,0,0,.35);}

/* GALLERY WRAPPER */
.g-wrap{padding:4rem 3rem 6rem;background:var(--cream);color:#14141c;min-height:60vh;}
.gallery-grid-video{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:2.4rem;max-width:1420px;margin:0 auto;}
.g-item-video{
  position:relative;background:#fff;padding:10px 10px 38px;border:2px solid #111;
  border-radius:10px;box-shadow:6px 6px 0 rgba(0,0,0,.15);
  transition:box-shadow .3s ease;
}
.g-item-video:nth-child(odd){--base-rot: -1.2deg;}
.g-item-video:nth-child(even){--base-rot: 1.2deg;}
.g-item-video:hover{box-shadow:12px 12px 0 rgba(0,0,0,.22);z-index:2;}
.video-inner{
  position:relative;width:100%;height:280px;background:#0d0d14;
  border:1.5px solid #111;border-radius:6px;overflow:hidden;
}
.video-inner iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}

footer{padding:3rem;background:var(--ink);color:var(--cream);text-align:center;font-family:var(--fk);font-size:.85rem;border-top:1px solid rgba(244,240,228,.15);}
footer a{color:var(--lime);text-decoration:underline;text-underline-offset:4px;}

@media(max-width:768px){
  .topbar,.g-header,.g-wrap,footer{padding-left:1.5rem;padding-right:1.5rem;}
  .gallery-grid-video{grid-template-columns:1fr;}
  .g-item-video:nth-child(odd),.g-item-video:nth-child(even){--base-rot: 0deg;}
  .video-inner{height:220px;}
}

.vgroup{max-width:1420px;margin:0 auto 3rem;}
.vgroup[hidden]{display:none;}
.vgroup-h{display:flex;align-items:center;gap:.9rem;font-family:var(--fh);font-size:2.4rem;font-weight:700;color:#14141c;margin:0 0 1.6rem;}
.vgroup-h b{font-family:var(--fk);font-size:.72rem;letter-spacing:.06em;background:#14141c;color:var(--lime);padding:.2rem .7rem;border-radius:2rem;}
.vgroup-h::after{content:"";flex:1;height:2px;background:#14141c;opacity:.15;}
.vgroup .gallery-grid-video{max-width:none;margin:0;}
.vgroup .video-inner{height:auto;aspect-ratio:16/9;}
#g-reels,#g-square{grid-template-columns:repeat(auto-fill,minmax(250px,300px));justify-content:center;}
#g-reels .video-inner{aspect-ratio:9/16;}
#g-square .video-inner{aspect-ratio:1/1;}
@media(max-width:768px){#g-reels,#g-square{grid-template-columns:repeat(2,1fr);gap:1.2rem;}#g-videos{grid-template-columns:1fr;}.vgroup-h{font-size:1.9rem;}}
</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='26' fill='%230A0A10'/%3E%3Ctext x='64' y='78' text-anchor='middle' font-family='cursive' font-size='42' font-weight='700' fill='%23F4F0E4'%3EBadal.%3C/text%3E%3C/svg%3E">
</head>
<body>

<div id="cur"></div>
<div id="cur-r"></div>

<div class="topbar">
  <a href="index.html#reel" class="back-link follow-mouse" data-mult="0.45">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Portfolio
  </a>
  <a href="index.html" class="n-logo follow-mouse" data-mult="0.45">Badal<span>.</span></a>
</div>

<header class="g-header blueprint">
  <div class="g-cat-badge follow-mouse" data-mult="0.6">VIDEO EDIT</div>
  <h1 class="g-title follow-mouse" data-mult="0.9">Video Production</h1>
  <p class="g-desc follow-mouse" data-mult="0.7">Promotional, corporate and campaign videos — from raw footage to final cut.</p>
  <a href="https://drive.google.com/drive/folders/1j0LUGZe1DxmwQwKPrEOJ5wl5q7IfvRLF" target="_blank" class="g-drive follow-mouse" data-mult="0.8">
    <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/></svg>
    View on Google Drive →
  </a>
</header>

<div class="g-wrap">
  <section class="vgroup"><h2 class="vgroup-h">Reels <b>9:16</b></h2>
  <div class="gallery-grid-video" id="g-reels">
  </div></section>
  <section class="vgroup"><h2 class="vgroup-h">Videos <b>16:9</b></h2>
  <div class="gallery-grid-video" id="g-videos">
    <div class="g-item-video follow-mouse" data-mult="0.75"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1EwgmbfyfKDYe_soF2MCTL-paiTlnmR2I/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.8"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1IfQygw0KnRdxBHwi2cxqAJ7FIiJx-cBn/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.7"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1P1tcqRQM5DbJk9HGQjXCph3DgWsVBiEZ/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.85"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1TqADMICCQ1bF6MzpNo912jL08MV3GoFa/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.75"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1WkAjngLdiSh3pWFCXvwWFInMgeAVs9vQ/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.8"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1ZBGS9oaY6BYM9AyY96iVVa9zkZ0-abqC/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.7"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1ZpFvWcY7tSHVtMWnA6F7hbxzJ4HlQQyN/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.85"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1aumAZsJ-QrxYz8UPa0t1ncw0qQysmOmJ/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.75"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1b-xlVFc2K1GMD_Lu32v5wyXVnXFFSyLD/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.8"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1bEgsrbXVzsr2TtprTeZYsl8woK7WBFQ8/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.7"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1d74uFFVHnh2aWROFFe9rgF2cdzHjEf2h/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.85"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1k416TLkOf6N8YLKhgJvpeFZY6pDVxUii/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.75"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1kdTm0oTiqbmQsOf-zb1BqUbRCiEyy2I9/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.8"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1vBW_pL55hiHuEQ4sXfMJhlZosOmfySgQ/preview" allowfullscreen loading="lazy"></iframe></div></div>
    <div class="g-item-video follow-mouse" data-mult="0.7"><div class="video-inner"><iframe src="https://drive.google.com/file/d/1yIx4qXBR0x3-tDJY3Cjk0kQ7ZVlErdF5/preview" allowfullscreen loading="lazy"></iframe></div></div>
  </div></section>
  <section class="vgroup"><h2 class="vgroup-h">Square <b>1:1</b></h2>
  <div class="gallery-grid-video" id="g-square">
  </div></section>
</div>

<footer class="follow-mouse" data-mult="0.4">
  &copy; 2026 Badal Rana — <a href="index.html">Back to Portfolio Home</a>
</footer>

<script>
const cur=document.getElementById('cur'), curR=document.getElementById('cur-r');
let targetX=window.innerWidth/2, targetY=window.innerHeight/2, curX=targetX, curY=targetY, ringX=targetX, ringY=targetY, ringVx=0, ringVy=0;
let smoothNormX=0, smoothNormY=0;
const followNodes=Array.from(document.querySelectorAll('.follow-mouse'));

window.addEventListener('mousemove',e=>{targetX=e.clientX;targetY=e.clientY;},{passive:true});

function animLoop(){
  curX+=(targetX-curX)*0.35; curY+=(targetY-curY)*0.35;
  cur.style.left=curX+'px'; cur.style.top=curY+'px';
  const ax=(targetX-ringX)*0.045, ay=(targetY-ringY)*0.045;
  ringVx=(ringVx+ax)*0.72; ringVy=(ringVy+ay)*0.72;
  ringX+=ringVx; ringY+=ringVy;
  curR.style.left=ringX+'px'; curR.style.top=ringY+'px';

  const normX=(targetX-window.innerWidth/2)/(window.innerWidth/2);
  const normY=(targetY-window.innerHeight/2)/(window.innerHeight/2);
  smoothNormX+=(normX-smoothNormX)*0.055;
  smoothNormY+=(normY-smoothNormY)*0.055;

  const px=(smoothNormX*14).toFixed(2);
  const py=(smoothNormY*10).toFixed(2);

  for(let i=0;i<followNodes.length;i++){
    const node=followNodes[i];
    const mult=node.getAttribute('data-mult')||'1';
    node.style.setProperty('--px',px+'px');
    node.style.setProperty('--py',py+'px');
    node.style.setProperty('--pm',mult);
  }
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

document.querySelectorAll('a, button, .g-item-video').forEach(el=>{
  el.addEventListener('mouseenter',()=>{cur.style.transform='translate(-50%,-50%) scale(2)';curR.style.transform='translate(-50%,-50%) scale(1.4)';});
  el.addEventListener('mouseleave',()=>{cur.style.transform='translate(-50%,-50%) scale(1)';curR.style.transform='translate(-50%,-50%) scale(1)';});
});
document.querySelectorAll('iframe').forEach(el=>{
  el.addEventListener('mouseenter',()=>document.body.classList.add('hide-cursor'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('hide-cursor'));
});
</script>
<script>
(function(){
  var vids=document.getElementById('g-videos'),reels=document.getElementById('g-reels'),sq=document.getElementById('g-square');
  var items=Array.prototype.slice.call(vids.children),pending=items.length;
  function sync(){[reels,vids,sq].forEach(function(g){g.parentNode.hidden=!g.children.length;});}
  sync();
  items.forEach(function(it,idx){
    it._i=idx;var f=it.querySelector('iframe'),m=f&&f.src.match(/\/d\/([\w-]+)/);
    if(!m){return;}
    var im=new Image();
    im.onload=function(){var r=im.naturalWidth/im.naturalHeight;it._b=r<0.8?'p':(r>1.25?'l':'s');done();};
    im.onerror=done;
    im.src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400';
  });
  function done(){if(--pending>0)return;
    var by={p:[],l:[],s:[]};items.forEach(function(it){by[it._b||'l'].push(it);});
    by.p.forEach(function(e){reels.appendChild(e);});by.s.forEach(function(e){sq.appendChild(e);});
    by.l.forEach(function(e){vids.appendChild(e);});sync();}
  setTimeout(function(){if(pending>0){pending=1;done();}},6000);
})();
</script>
